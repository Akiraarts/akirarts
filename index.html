<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Akira 明 — On‑chain live arts</title>
  <style>
    :root{ --fg:#111; --muted:#666; --bg:#fff; --card:#fafafa; --line:#e6e6e6; }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0; background:var(--bg); color:var(--fg); font-family: -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;}

    .wrap{max-width:min(1100px,94vw); margin:0 auto; padding:32px 18px 60px}

    /* Header matches your reference */
    .h1{font-size:40px; font-weight:700; margin:0 0 6px}
    .h2{font-size:26px; font-weight:600; margin:0 0 4px}
    .jp{font-size:26px; font-weight:600; margin:0 0 28px}

    /* Post row: image left (fixed), text right */
    .post{display:grid; grid-template-columns: 240px 1fr; gap:22px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin:0 0 18px; box-shadow:0 2px 6px rgba(0,0,0,.04)}
    .thumb{position:relative; width:100%; aspect-ratio:1/1; border-radius:12px; overflow:hidden; background:#eee}
    .thumb img{width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; -webkit-user-drag:none; user-select:none}
    .thumb .shield{position:absolute; inset:0; background:transparent}

    .meta{display:flex; flex-direction:column; gap:10px}
    .title{font-size:22px; font-weight:700}
    .caption{font-size:16px; color:var(--muted); line-height:1.5}

    /* Pagination with numbers */
    .pager{display:flex; justify-content:center; gap:6px; margin:22px 0 0}
    .pager button{border:1px solid #000; background:#000; color:#fff; padding:8px 12px; border-radius:10px; cursor:pointer}
    .pager button.active{background:#444; border-color:#444}

    /* Responsive */
    @media (max-width:820px){
      .h1{font-size:32px} .h2,.jp{font-size:20px}
      .post{grid-template-columns:1fr; gap:14px}
      .thumb{aspect-ratio:4/3}
      .title{font-size:20px}
    }
  </style>
  <script>
    // best‑effort protection against easy saves
    document.addEventListener('contextmenu', e=> e.preventDefault());
    document.addEventListener('dragstart', e=> e.preventDefault());
  </script>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="h1">Akira 明</div>
      <div class="h2">onchain live arts.</div>
      <div class="jp">オンチェーン・ライブ・アーツ</div>
    </header>

    <main id="list"></main>
    <nav id="pager" class="pager"></nav>
  </div>

  <script>
    // ======= CONFIG =======
    const POSTS_JSON = 'posts.json'; // path relative to this HTML
    const PER_PAGE = 10;

    let posts = [];
    let page = 1;

    async function load(){
      try{
        const res = await fetch(POSTS_JSON, {cache:'no-cache'});
        if(!res.ok) throw new Error('Failed to load posts.json');
        posts = await res.json();
      }catch(err){
        console.warn(err);
        // Fallback sample placeholders
        posts = [
          {src:"uploads/sample1.gif", title:"Title", caption:"Caption"},
          {src:"uploads/sample2.gif", title:"Title", caption:"Caption"}
        ];
      }
      render();
    }

    function render(){
      const list = document.getElementById('list');
      list.innerHTML = '';

      // newest first: assume file is already ordered, otherwise sort by optional date property
      const totalPages = Math.max(1, Math.ceil(posts.length / PER_PAGE));
      if(page > totalPages) page = totalPages;
      const start = (page-1)*PER_PAGE;
      const end = start + PER_PAGE;
      const pageItems = posts.slice(start, end);

      for(const p of pageItems){
        const row = document.createElement('section');
        row.className = 'post';

        const left = document.createElement('div');
        left.className = 'thumb';
        const img = document.createElement('img');
        img.src = p.src; // relative URL inside repo, e.g. uploads/your.gif
        img.alt = p.title || 'art';
        img.loading = 'lazy';
        left.appendChild(img);
        const shield = document.createElement('div');
        shield.className = 'shield';
        left.appendChild(shield);

        const right = document.createElement('div');
        right.className = 'meta';
        const t = document.createElement('div'); t.className = 'title'; t.textContent = p.title || '';
        const c = document.createElement('div'); c.className = 'caption'; c.textContent = p.caption || '';
        right.appendChild(t); right.appendChild(c);

        row.appendChild(left);
        row.appendChild(right);
        list.appendChild(row);
      }

      renderPager(totalPages);
    }

    function renderPager(total){
      const pager = document.getElementById('pager');
      pager.innerHTML='';
      for(let i=1;i<=total;i++){
        const btn = document.createElement('button');
        btn.textContent = i;
        if(i===page) btn.classList.add('active');
        btn.addEventListener('click', ()=>{ page=i; render(); window.scrollTo({top:0,behavior:'smooth'}); });
        pager.appendChild(btn);
      }
    }

    load();
  </script>
</body>
</html>
